name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: platform
          POSTGRES_USER: platform_bootstrap
          POSTGRES_PASSWORD: ci-bootstrap-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform_bootstrap -d platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: pnpm

      # Temporary lockfile repair after merging the latest Dependabot baseline.
      - name: Repair and commit lockfile
        if: github.event_name == 'pull_request' && github.actor == 'mintymelinda' && github.event.pull_request.head.ref == 'phase-1/identity-workspaces-tenant-isolation'
        run: |
          pnpm install --no-frozen-lockfile
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: repair pnpm lockfile after dependency baseline update"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate local infrastructure definition
        run: docker compose --env-file infra/compose/.env.example -f infra/compose/docker-compose.yml config --quiet

      - name: Validate PostgreSQL migration/runtime role separation
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:18.6' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp infra/postgres/init/001-roles.sql "$container_id:/tmp/001-roles.sql"
          docker exec "$container_id" psql -U platform_bootstrap -d platform -v ON_ERROR_STOP=1 -f /tmp/001-roles.sql
          runtime_flags="$(docker exec "$container_id" psql -U platform_bootstrap -d platform -Atqc "SELECT rolsuper::text || ':' || rolbypassrls::text FROM pg_roles WHERE rolname='platform_runtime'")"
          migrator_flags="$(docker exec "$container_id" psql -U platform_bootstrap -d platform -Atqc "SELECT rolsuper::text || ':' || rolbypassrls::text FROM pg_roles WHERE rolname='platform_migrator'")"
          schema_owner="$(docker exec "$container_id" psql -U platform_bootstrap -d platform -Atqc "SELECT pg_get_userbyid(nspowner) FROM pg_namespace WHERE nspname='public'")"
          test "$runtime_flags" = "false:false"
          test "$migrator_flags" = "false:false"
          test "$schema_owner" = "platform_migrator"

      - name: Apply schema migrations as the dedicated migrator
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:18.6' --format '{{.ID}}' | head -n 1)"
          docker exec "$container_id" mkdir -p /tmp/migrations /tmp/db-tests
          docker cp infra/postgres/migrations/. "$container_id:/tmp/migrations/"
          docker exec -e PGPASSWORD=local-migration-only "$container_id" sh -c 'for migration in /tmp/migrations/*.sql; do psql -h 127.0.0.1 -U platform_migrator -d platform -v ON_ERROR_STOP=1 -f "$migration"; done'

      - name: Verify tenant isolation as the restricted runtime role
        run: |
          container_id="$(docker ps --filter 'ancestor=postgres:18.6' --format '{{.ID}}' | head -n 1)"
          docker cp infra/postgres/tests/. "$container_id:/tmp/db-tests/"
          docker exec -e PGPASSWORD=local-runtime-only "$container_id" psql -h 127.0.0.1 -U platform_runtime -d platform -v ON_ERROR_STOP=1 -f /tmp/db-tests/phase1-tenant-isolation.sql

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Check migration naming and ordering
        run: pnpm db:migrations:check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
