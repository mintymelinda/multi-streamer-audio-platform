name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.0

      # Generate the initial lockfile while bootstrapping the empty repository.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Normalize the initial scaffold once; the resulting files are committed
      # from the review branch after this CI run.
      - name: Normalize initial workspace formatting
        run: pnpm format

      - name: Package normalized files for review-branch commit
        run: |
          git diff --name-only > /tmp/phase0-files.txt
          if [ -f pnpm-lock.yaml ]; then echo pnpm-lock.yaml >> /tmp/phase0-files.txt; fi
          sort -u /tmp/phase0-files.txt -o /tmp/phase0-files.txt
          tar -czf phase0-normalized.tar.gz -T /tmp/phase0-files.txt

      - name: Preserve normalized files and lockfile
        uses: actions/upload-artifact@v4
        with:
          name: phase0-normalized-files
          path: phase0-normalized.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Validate local infrastructure definition
        run: docker compose --env-file infra/compose/.env.example -f infra/compose/docker-compose.yml config --quiet

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
