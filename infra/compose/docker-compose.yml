name: streamer-audio-platform-dev

services:
  workspace:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      target: workspace
    restart: unless-stopped
    init: true
    working_dir: /workspace
    command: ["sh", "-lc", "pnpm install --frozen-lockfile && exec sleep infinity"]
    healthcheck:
      test: ["CMD-SHELL", "test -x node_modules/.bin/tsc"]
      interval: 5s
      timeout: 3s
      retries: 60
    volumes:
      - ../..:/workspace
      - workspace_node_modules:/workspace/node_modules
      - pnpm_store:/home/node/.local/share/pnpm/store
    environment:
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://localhost:9000}
      OBJECT_STORAGE_INTERNAL_ENDPOINT: ${OBJECT_STORAGE_INTERNAL_ENDPOINT:-http://object-storage:9000}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-platform-assets}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-local-minio}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-local-minio-password}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      DELETION_LEDGER_HMAC_KEY: ${DELETION_LEDGER_HMAC_KEY:-local-ledger-signing-key-at-least-32-bytes}
      DELETION_LEDGER_S3_ENDPOINT: ${DELETION_LEDGER_S3_ENDPOINT:-http://object-storage:9000}
      DELETION_LEDGER_S3_BUCKET: ${DELETION_LEDGER_S3_BUCKET:-platform-deletion-ledger}
      DELETION_LEDGER_S3_PREFIX: ${DELETION_LEDGER_S3_PREFIX:-v1/exports}
      DELETION_LEDGER_S3_ACCESS_KEY: ${DELETION_LEDGER_S3_ACCESS_KEY:-local-minio}
      DELETION_LEDGER_S3_SECRET_KEY: ${DELETION_LEDGER_S3_SECRET_KEY:-local-minio-password}
      DELETION_LEDGER_S3_REGION: ${DELETION_LEDGER_S3_REGION:-us-east-1}
      DELETION_LEDGER_S3_ALLOW_INSECURE_HTTP: ${DELETION_LEDGER_S3_ALLOW_INSECURE_HTTP:-true}
      INVIDIOUS_INSTANCE_URL: ${INVIDIOUS_INSTANCE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      target: workspace
    restart: unless-stopped
    init: true
    working_dir: /workspace
    command: ["sh", "-lc", "pnpm --filter @platform/worker build && exec pnpm --filter @platform/worker start"]
    volumes:
      - ../..:/workspace
      - workspace_node_modules:/workspace/node_modules
      - pnpm_store:/home/node/.local/share/pnpm/store
    environment:
      NODE_ENV: development
      DATABASE_URL: ${WORKER_DATABASE_URL:-postgres://platform_worker:local-worker-only@postgres:5432/platform}
      PROVIDER_EXECUTION_DATABASE_URL: ${PROVIDER_EXECUTION_DATABASE_URL:-postgres://platform_provider_worker:local-provider-worker-only@postgres:5432/platform}
      REDIS_URL: redis://redis:6379
      PROVIDER_EXECUTION_HANDOFF_URL: ${PROVIDER_EXECUTION_HANDOFF_URL:-http://api:3000/internal/provider-executions/handoff}
      PROVIDER_EXECUTION_HANDOFF_SECRET: ${PROVIDER_EXECUTION_HANDOFF_SECRET:-local-provider-execution-handoff-secret-at-least-32-bytes}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      workspace:
        condition: service_healthy

  checks:
    profiles: ["checks"]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      target: checks
    init: true
    working_dir: /workspace
    command:
      [
        "sh",
        "-lc",
        "pnpm format:check && pnpm lint && pnpm typecheck && pnpm db:migrations:check && pnpm test && pnpm build",
      ]

  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:-local-bootstrap-only}
      PLATFORM_MIGRATOR_PASSWORD: ${PLATFORM_MIGRATOR_PASSWORD:-local-migration-only}
      PLATFORM_RUNTIME_PASSWORD: ${PLATFORM_RUNTIME_PASSWORD:-local-runtime-only}
      PLATFORM_WORKER_PASSWORD: ${PLATFORM_WORKER_PASSWORD:-local-worker-only}
      PLATFORM_PROVIDER_WORKER_PASSWORD: ${PLATFORM_PROVIDER_WORKER_PASSWORD:-local-provider-worker-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_bootstrap -d platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.10.3
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  object-storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - object_storage_data:/data
  object-storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      object-storage:
        condition: service_started
    entrypoint: ["/bin/sh", "-lc"]
    command: >-
      until mc alias set local http://object-storage:9000 "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"; do sleep 2; done &&
      mc mb --ignore-existing local/platform-assets &&
      mc mb --with-lock --ignore-existing local/platform-deletion-ledger &&
      mc retention set --default COMPLIANCE 36500d local/platform-deletion-ledger &&
      mc anonymous set none local/platform-deletion-ledger &&
      printf '%s' '{"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["PUT","GET","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag","Content-Length","Content-Type"],"MaxAgeSeconds":3600}]}' > /tmp/assets-cors.json &&
      mc cors set local/platform-assets /tmp/assets-cors.json &&
      mc anonymous set none local/platform-assets
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password}

volumes:
  postgres_data:
  redis_data:
  object_storage_data:
  workspace_node_modules:
  pnpm_store:
